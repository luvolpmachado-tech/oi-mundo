<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guia das Skills</title>
  <style>
    :root {
      --bg: #f7f6f3; --fg: #1b1b1a; --muted: #6b6a66; --card: #ffffff; --line: #e4e2dc; --chip: #efede8;
      --accent: #3b5bdb; --accent-bg: #e7ecfd; --on-accent: #ffffff;
      --ok: #1f7a46; --ok-bg: #e2f4e9; --warn: #8a5a00; --warn-bg: #fdf3dc; --warn-line: #f1dfb1; --err: #c0392b;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --fg: #ecebe7; --muted: #a09e98; --card: #1e1e1c; --line: #2f2e2b; --chip: #2a2927;
        --accent: #8ea6ff; --accent-bg: #232b4a; --on-accent: #141413;
        --ok: #6fd39a; --ok-bg: #18301f; --warn: #f0c060; --warn-bg: #2e2716; --warn-line: #4a3d1e; --err: #ff8a7a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
    .capa { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .caixa { width: 100%; max-width: 360px; text-align: center; }
    .cadeado { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; }
    .caixa h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.01em; }
    .caixa p { color: var(--muted); margin: 0 0 24px; }
    .caixa input { width: 100%; font: inherit; font-size: 1.6rem; letter-spacing: .5em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .caixa input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .caixa button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
    .caixa button:disabled { opacity: .6; cursor: wait; }
    .erro { color: var(--err); min-height: 1.5em; margin-top: 12px; font-size: .95rem; }
  </style>
</head>
<body>
  <div class="capa" id="capa">
    <form class="caixa" id="form">
      <div class="cadeado" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h1>Conteúdo protegido</h1>
      <p>Digite a senha para continuar.</p>
      <input id="senha" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Senha" autofocus>
      <button id="entrar" type="submit">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>
  </div>

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function abrir(senha) {
      const sal = b64(PACOTE.s), iv = b64(PACOTE.i), cifra = b64(PACOTE.c), mac = b64(PACOTE.m);
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: PACOTE.n }, base, 512));
      const chaveAes = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
      const chaveMac = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
      const dados = new Uint8Array(iv.length + cifra.length);
      dados.set(iv); dados.set(cifra, iv.length);
      if (!await crypto.subtle.verify('HMAC', chaveMac, mac, dados)) return null;
      const claro = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, chaveAes, cifra);
      return new TextDecoder().decode(claro);
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const botao = document.getElementById('entrar'), erro = document.getElementById('erro');
      botao.disabled = true; botao.textContent = 'Abrindo…'; erro.textContent = '';
      try {
        const html = await abrir(document.getElementById('senha').value);
        if (html === null) {
          erro.textContent = 'Senha incorreta.';
        } else {
          document.title = 'Guia das Skills';
          document.body.innerHTML = html;
          window.scrollTo(0, 0);
          return;
        }
      } catch (err) {
        erro.textContent = 'Não foi possível abrir neste navegador.';
      }
      botao.disabled = false; botao.textContent = 'Entrar';
      document.getElementById('senha').select();
    });
  </script>
